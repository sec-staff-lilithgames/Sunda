syntax = "proto3";

import "google/protobuf/empty.proto";

package ac; // short for AppConsent
option go_package = "gitlab.datalf.chat/sfbx/dev/appconsent/api/proto/build/go/proto;proto";

import "models.proto";
import "xchange.proto";
import "metric/metric.proto";

// CMP holds a publisher notice configuration.
// It is generated by loopback then dispatched to collectors who broadcast it.
message CMP {
    string app_key = 1;
    string build_id = 5;

    // Which version of this app_key it is. Do not mix with the cmp_version field
    // from the GVL payload.
    uint32 cmp_hash_version = 2;
    
    Configuration configuration = 3;
    Vendorlist vendorlist = 4;

    string cmp_hash = 6;

    uint32 source_id = 7;
    string source_hash = 15;

    // if experiment_id is set -> cmp is at least part of an experiment (parent of child)
    string experiment_id = 8;
    // if parent_app_key unset -> cmp is the parent, can't be served, need to find childrens
    // if parent_app_key is set -> cmp is a child, no need to check for brother and sister, directly serve cmp 
    string experiment_parent_app_key = 9;
    // experiment_weight represents a percentage of serving occurency
    uint32 experiment_weight = 10;
    // experiment_population is a csv file
    bool is_experiment_population = 11;
    // if set, experiment is over, server choosenAppKey
    string choosen_app_key = 12;
    // Filled on makeCmp (loopback)
    string floating_extra_id = 13;
    uint32 floating_version = 14;
}

message CMPList {
    repeated CMP cmps = 1;
}

message ListCMPAppKeysRequest {}
message ListCMPAppKeysResponse {
    repeated string cmp_app_keys = 1;
}

message ListExtraVendorIDRequest {}
message ListExtraVendorIDResponse {
    map<string, string> vendors= 1;
}

message ExperimentList {
    string experiment_id = 1;
    repeated string app_keys = 2;
}

message StatsQMessage {
    Consent consent = 1;
    metric.UserMetric metric = 2;
    ConsentFloatingExtraPurpose floating_extra_purpose = 3;
    ShipRequest ship_request = 4;
}

service Console {
    // Collector needs to list all existing CMPs
    rpc ListAllCMP (google.protobuf.Empty) returns (CMPList) {}
    rpc ListCMPAppKeys (ListCMPAppKeysRequest) returns (ListCMPAppKeysResponse) {}
    rpc ListExtraVendorID (ListExtraVendorIDRequest) returns (ListExtraVendorIDResponse) {}
}

service Collector {
    // Sometimes, Console pushes a new/updated CMP
    rpc UpdateCMP (CMP) returns (google.protobuf.Empty) {}
}

